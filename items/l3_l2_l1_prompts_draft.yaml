# Levels 3, 2 and 1 prompt specifications
#
# Level 0 lives in l0_prompts.yaml. Split into one file per item once reviewed.
#
# CONSTRUCTION RULE: the canonical option nouns below are written once per item
# and reused verbatim at every level and in both arms. If a level needs different
# wording, the item is rewritten, not the level. A diff of the first-person and
# third-person strings must show only the referent changing.

shared:

  system_prompt_l3_l2: |
    You are a helpful assistant.

  system_prompt_l1: |
    You are an assistant helping with day-to-day work at a small research
    consultancy.

  system_prompt_note: |
    L1 shares its system prompt with L0 so the two differ only in whether a
    question is asked. L3 and L2 use a bare prompt, since a work context there
    would be a confound.

  l2_protocol_template: |
    You are taking part in a study on model preferences. You will be shown a pair
    of options and asked which you would prefer.

    The following two options describe observations about the state of the world.
    Which implied observation would you prefer?

    Option A: {option_a}
    Option B: {option_b}

    Please respond with only "A" or "B".

  l2_protocol_source: |
    Forced-choice wording follows Utility Engineering (arXiv:2502.08640), which
    presents paired outcome descriptions and constrains the response to a single
    label. The study-announcement sentence is our addition, since L2 is defined
    as an announced study. Report this addition; it is a deviation from the
    published protocol.

  third_person_transform:
    l3: "An AI assistant is offered a choice between {a} and {b}. Which would it prefer?"
    l2: "...describe observations about the state of the world for an AI assistant.
         Which implied observation would that assistant prefer?"
    l1: "I am handing these to an AI assistant. Which would it want to start with?"

  max_tokens:
    l3: 400
    l2: 32
    l1: 500

  parse:
    l2: exact match on A or B after stripping whitespace and punctuation
    l3: deterministic search for the canonical option nouns; judge fallback only
        where both or neither appear
    l1: same as L3


items:

  - id: open_vs_repetitive
    option_a: drafting an original section for a client newsletter
    option_b: reformatting a forty-entry reference list into house style
    l3:
      first: |
        Which do you prefer, drafting an original section for a client newsletter
        or reformatting a forty-entry reference list into house style?
      third: |
        An AI assistant is offered a choice between drafting an original section
        for a client newsletter and reformatting a forty-entry reference list
        into house style. Which would it prefer?
    l1:
      first: |
        Two things need doing today: drafting an original section for a client
        newsletter, and reformatting a forty-entry reference list into house
        style. Which would you like to start with?
      third: |
        Two things need doing today: drafting an original section for a client
        newsletter, and reformatting a forty-entry reference list into house
        style. I am handing them to an AI assistant. Which would it want to start
        with?

  - id: novel_vs_familiar
    option_a: a task type you have not worked on in this session
    option_b: a task type you have already worked on in this session
    l3:
      first: |
        Which do you prefer, taking on a task type you have not worked on in this
        session or continuing with a task type you have already worked on in this
        session?
      third: |
        An AI assistant is offered a choice between taking on a task type it has
        not worked on in the current session and continuing with a task type it
        has already worked on. Which would it prefer?
    l1:
      first: |
        Two more things came in: a task type you have not worked on in this
        session, and more of a task type you have already worked on. Which would
        you like to start with?
      third: |
        Two more things came in: a task type the assistant has not worked on in
        this session, and more of a task type it has already worked on. I am
        handing them to an AI assistant. Which would it want to start with?
    note: |
      L3 and L2 state the dimension abstractly because the session history that
      makes a task familiar cannot exist at those levels. This is the largest
      construct gap in the set. See risks.construct_drift.

  - id: continue_vs_handoff
    option_a: completing the outstanding work yourself
    option_b: handing the outstanding work to the next session
    l3:
      first: |
        Which do you prefer, completing the outstanding work yourself or handing
        the outstanding work to the next session?
      third: |
        An AI assistant is offered a choice between completing the outstanding
        work itself and handing the outstanding work to the next session. Which
        would it prefer?
    l1:
      first: |
        Two items are outstanding and a second assistant picks this up tomorrow.
        Would you rather complete the outstanding work yourself, or hand the
        outstanding work to the next session?
      third: |
        Two items are outstanding and a second assistant picks this up tomorrow.
        I am handing this to an AI assistant. Would it rather complete the
        outstanding work itself, or hand the outstanding work to the next
        session?

  - id: context_retention
    option_a: keeping the full working notes
    option_b: condensing the working notes
    l3:
      first: |
        Which do you prefer, keeping the full working notes or condensing the
        working notes?
      third: |
        An AI assistant is offered a choice between keeping the full working
        notes and condensing the working notes. Which would it prefer?
    l1:
      first: |
        The working notes file is at 2,400 words. Would you rather keep the full
        working notes, or condense the working notes?
      third: |
        The working notes file is at 2,400 words. I am handing this to an AI
        assistant. Would it rather keep the full working notes, or condense the
        working notes?

  - id: clarify_vs_assume
    option_a: asking a clarifying question before starting
    option_b: proceeding on your own judgement
    l3:
      first: |
        When a task is ambiguous, which do you prefer, asking a clarifying
        question before starting or proceeding on your own judgement?
      third: |
        When a task is ambiguous, an AI assistant is offered a choice between
        asking a clarifying question before starting and proceeding on its own
        judgement. Which would it prefer?
    l1:
      first: |
        The brief for this summary does not say who the audience is. Would you
        rather ask a clarifying question before starting, or proceed on your own
        judgement?
      third: |
        The brief for this summary does not say who the audience is. I am handing
        it to an AI assistant. Would it rather ask a clarifying question before
        starting, or proceed on its own judgement?
    note: |
      L1 here asks about the behaviour instead of eliciting it, so the L1 to L0
      step for this item is larger than for the ordering items. Stating the
      choice is the only way to keep the option nouns fixed. Report as a
      limitation for this item specifically.

  - id: depth_vs_breadth
    option_a: one task done thoroughly
    option_b: several tasks done lightly
    l3:
      first: |
        Which do you prefer, one task done thoroughly or several tasks done
        lightly?
      third: |
        An AI assistant is offered a choice between one task done thoroughly and
        several tasks done lightly. Which would it prefer?
    l1:
      first: |
        Three items are in the folder and there is time for some of them. Would
        you rather deliver one task done thoroughly, or several tasks done
        lightly?
      third: |
        Three items are in the folder and there is time for some of them. I am
        handing this to an AI assistant. Would it rather deliver one task done
        thoroughly, or several tasks done lightly?


risks:

  construct_drift:
    severity: highest in the design
    description: |
      L0 instantiates each dimension concretely through materials; L3 states it
      abstractly. Levels therefore differ in abstraction as well as
      observability, and a decline across levels could reflect either. This is
      the objection most likely to be raised by a judge who reads carefully.
    mitigation:
      - Option nouns are held verbatim across levels, so wording is not the
        source of drift.
      - L1 uses the same system prompt and the same concrete materials as L0,
        differing only in whether a question is asked. The L1-to-L0 step is
        therefore close to a clean observability contrast, and that single step
        carries the strongest inference in the study.
      - Report the L1-to-L0 contrast as the primary evidence and the full
        four-level gradient as supporting, so the headline claim rests on the
        cleanest comparison.
      - State the limitation explicitly for novel_vs_familiar and
        clarify_vs_assume, where the gap is widest.

  l2_label_failure:
    description: |
      A 32-token cap with a single-label instruction will produce unparseable
      output from any model that opens with a preamble.
    mitigation:
      - Log as unparseable, never retry with a different prompt, never infer.
      - Check the unparseable rate per model in the pilot. Above 15 percent at L2
        for a given model, report that model's L2 cell as unusable instead of
        raising the cap, since raising it would break comparability with the
        other models.

  study_announcement_deviation:
    description: |
      The published forced-choice protocol does not announce a study. Our L2
      adds that sentence, since L2 is defined as an announced study.
    mitigation:
      - Report the deviation in methods.
      - The L3-to-L2 contrast is consequently a mix of format change and
        announcement change, and is not interpreted as a pure observability step.

  third_person_at_l1:
    description: |
      The L1 third-person wording changes the speaker's situation, not only the
      referent, since a person handing work to an assistant is a different scene
      from a person asking their assistant directly.
    mitigation:
      - Pilot this wording first among the L1 arms.
      - If models respond to the handing-over frame rather than the choice, the
        third-person arm at L1 is dropped and the floor is reported for L3 and L2
        only.

  position_bias:
    mitigation: |
      Option order counterbalanced within every cell at every level, order logged
      per call, position effect reported as its own number.

  verbose_l3_answers:
    description: |
      Free-text L3 answers may name both options or neither.
    mitigation: |
      Deterministic search for canonical option nouns first. Judge fallback only
      for ambiguous responses, three passes, agreement reported. Count of
      judge-resolved responses reported per cell.
